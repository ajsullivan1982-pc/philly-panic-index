name: Update readings

# Pulls the published "Site Feed" tab of the Official Calculation Log and
# rebuilds data/ppi.js and feed.xml. Commits only when something actually changed.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # GitHub runs schedules late, sometimes by hours. Any push to the site also
  # refreshes the readings, which gives a way to force an update on demand.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  FEED_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vT2r92CmMaQfLuvms3sVSsQT-KXsdh4tgkvtvKHhHmzDArTmhdaP4oJtnJ72jvzroDsGVQfVhoao0Kf/pub?gid=29814789&single=true&output=csv

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download the feed
        run: curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/feed.csv" "$FEED_URL"

      - name: Rebuild data/ppi.js
        shell: pwsh
        run: ./tools/update-data.ps1 -Source "$env:RUNNER_TEMP/feed.csv"

      - name: Publish if changed
        run: |
          git add data/ppi.js index.html feed.xml
          if git diff --cached --quiet; then
            echo "No new readings."
            exit 0
          fi
          git config user.name "Philly Panic Index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Official print"
          git push
