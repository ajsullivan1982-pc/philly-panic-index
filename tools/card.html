<!doctype html>
<!-- Source for assets/card.png, the 1200x630 link-preview image.
     Rebuild: msedge --headless --screenshot=assets\card.png --window-size=1200,630 tools\card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #040605; color: #dfe4da; font-family: "IBM Plex Mono", Consolas, monospace; }
  .bar { background: #ffb000; color: #2b1c00; font-size: 20px; font-weight: 600; letter-spacing: 0.08em; padding: 8px 56px; display: flex; justify-content: space-between; }
  .in { padding: 54px 56px 0; }
  h1 { font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 200px; line-height: 0.92; margin: 0; text-transform: uppercase; color: #f3f5ee; letter-spacing: 0.01em; }
  h1 em { font-style: normal; color: #3dff5c; }
  p { font-size: 30px; color: #808b82; margin: 34px 0 0; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; border-top: 6px solid #3dff5c; padding: 16px 56px; font-size: 24px; display: flex; justify-content: space-between; }
  .foot b { color: #3dff5c; font-weight: 500; }
  .tk span { margin-left: 26px; }
</style>
</head>
<body>
  <div class="bar"><span>PPI &lt;INDEX&gt; CITYWIDE</span><span>OFFICIAL PRINTS DAILY · 5:00 AM ET</span></div>
  <div class="in">
    <h1>Philly<br><em>Panic</em> Index</h1>
    <p>The numbers are real. The analysis is unnecessary.</p>
  </div>
  <div class="foot">
    <b>phillypanic.com</b>
    <span class="tk"><span style="color:#2fd6b5">BRDS</span><span style="color:#ff3d52">PHLS</span><span style="color:#3f86ff">SIXR</span><span style="color:#ff7a1a">FLYR</span></span>
  </div>
</body>
</html>
